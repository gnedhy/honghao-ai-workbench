[project]
name = "honghao-ai-workbench-api"
version = "0.1.0"
description = "Local API for the Honghao AI workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "pypdf==6.16.2",
  "python-multipart==0.0.32",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
